name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Build GameLibrary
        run: .\build.bat

      - name: Verify build
        shell: pwsh
        run: |
          if (!(Test-Path "dist\GameLibrary.exe")) {
            Write-Error "GameLibrary.exe was not created!"
            exit 1
          }

          Get-Item "dist\GameLibrary.exe"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: GameLibrary v1.0.${{ github.run_number }}
          body: |
            ## GameLibrary for Windows

            Download **GameLibrary.exe** below and run it on Windows.

            ### Installation
            1. Download `GameLibrary.exe`
            2. Run it
            3. If Windows SmartScreen appears, select **More info → Run anyway**
          files: dist/GameLibrary.exe
          make_latest: true
