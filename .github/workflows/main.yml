name: Build Windows App

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt
          python -m pip install pyinstaller

      - name: Build GameLibrary
        run: |
          .\build.bat

      - name: Verify build
        run: |
          if (!(Test-Path "dist\GameLibrary.exe")) {
            Write-Error "GameLibrary.exe was not created!"
            exit 1
          }

          Get-Item "dist\GameLibrary.exe"

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GameLibrary-Windows
          path: dist/GameLibrary.exe
